<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS | flex-grow Property - codegymtask23</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        h2 {
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        
        /* Cài đặt vùng chứa (Flex Container) */
        .container {
            display: flex;
            background-color: #2c3e50; /* Màu nền tối cho container */
            padding: 10px;
            gap: 10px; /* Khoảng cách giữa các item */
            width: 100%;
            height: 100px;
            box-sizing: border-box;
        }
        
        /* Cài đặt các item (Flex Items) */
        .item {
            background-color: #3498db; /* Màu xanh biển cho các item mặc định */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Áp dụng flex-grow cho riêng Item 2 */
        .item2 {
            flex-grow: 1; /* Item 2 sẽ "phát triển" và chiếm hết không gian thừa */
            background-color: #e74c3c; /* Đổi màu đỏ nổi bật */
        }
    </style>
</head>
<body>

    <h1>Thực hành: CSS flex-grow (codegymtask23)</h1>
    <p>
        <strong>Giải thích:</strong> Mặc định các Flex Item có <code>flex-grow: 0</code> (không tự giãn ra). <br>
        Trong ví dụ này, <strong>Item 2</strong> được cài đặt <code>flex-grow: 1</code>, nên nó sẽ "nuốt" trọn toàn bộ khoảng trống còn lại của Container màu đen.
    </p>

    <!-- Flex Container chứa 5 Flex Items -->
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item item2">Item 2 <br> (flex-grow: 1)</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

</body>
</html>
